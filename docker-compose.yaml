# LiveGrab 直播录制台 —— 部署与更新说明全部在 README（「快速开始（Docker）」与「更新与代理」两节）
#   首次启动：docker compose up -d    直接用镜像内代码，不联网、不 clone
#   版本更新：页面「系统设置 → 系统更新 → 立即更新」（走页面里配的代理，未配则直连）
services:
  livegrab:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: "${APP_VERSION:-0.1.51}"
        BUILD_COMMIT: "${BUILD_COMMIT:-}"
    image: bianyh8/livegrab:latest
    container_name: livegrab
    restart: unless-stopped
    init: true

    ports:
      - "${LIVEGRAB_PORT:-18080}:8080"

    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      PORT: "8080"
      RECORD_ROOT: "/data"
      CONFIG_DIR: "/config"
      LIVEGRAB_GITHUB_TOKEN: "${LIVEGRAB_GITHUB_TOKEN:-}"

    volumes:
      - ./data:/data
      - ./config:/config

    extra_hosts:
      - "host.docker.internal:host-gateway"

    stop_grace_period: 30s

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
