# LiveGrab 直播录制台 —— 一条命令起服务
#   docker compose up -d --build
#   open http://<主机IP>:18080    首次打开会要求设置管理员密码
services:
  livegrab:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建时注入 commit，供容器内「系统更新」精确比对版本；手动构建时可先 export BUILD_COMMIT=$(git rev-parse --short=12 HEAD)
        BUILD_COMMIT: "${BUILD_COMMIT:-}"
        # 镜像元数据版本号（与 app/package.json 对齐；发版时可用 .env 的 APP_VERSION 覆盖）
        APP_VERSION: "${APP_VERSION:-0.1.42}"
    image: bianyh8/livegrab:latest
    container_name: livegrab
    restart: unless-stopped
    init: true

    # 架构 B（容器内自更新）：容器首次启动会把代码仓库 clone 到 ./config/src 并切换到镜像内置版本，
    # 之后从该目录运行；页面「系统设置 → 系统更新 → 立即更新」在容器内完成
    # git pull → npm install → 自动重启，无需宿主机干预。
    # 镜像只提供 node_modules 基线、ffmpeg、git 与入口脚本；镜像级变更（ffmpeg/node 版本等）
    # 才需要在宿主机执行 docker compose up -d --build。
    # 注意：./config/src 由容器管理（可整目录删除后重启容器重新克隆）；能写该目录等于能在容器内执行代码。

    ports:
      # 左边是宿主机端口（默认 18080），可用 .env 里的 LIVEGRAB_PORT 改
      - "${LIVEGRAB_PORT:-18080}:8080"

    environment:
      # D15：时区由 compose 提供，页面上只读展示（改这里后 docker compose up -d 生效）
      TZ: "${TZ:-Asia/Shanghai}"
      PORT: "8080"
      # 录制成品目录（容器内路径，对应下面 /data 挂载）
      RECORD_ROOT: "/data"
      # 配置/账号/日志目录（对应下面 /config 挂载）
      CONFIG_DIR: "/config"
      # 私有仓库自动更新：代码仓库 bianyh8/livegrab 是私有的。
      # 该 Token 同时用于：①「系统更新」页从 GitHub 检测最新版本；
      # ② 容器首次启动 clone 仓库、③ 页面「立即更新」时 git pull（架构 B）。
      # 在宿主机建 .env 文件写一行 LIVEGRAB_GITHUB_TOKEN=ghp_xxx，或直接填在此处；
      # 不配则公开仓库可 clone 但无法检测私有仓库版本，页面提示"无法获取远程版本"。
      LIVEGRAB_GITHUB_TOKEN: "${LIVEGRAB_GITHUB_TOKEN:-}"
      # ---- 代理 ----
      # 项目里有「两个互相独立」的代理入口，只配一个会出现「首次能拉、更新还是慢」：
      #   ① 本文件的 LIVEGRAB_PROXY → 容器首次启动时的 git clone 与 npm install（deploy/entrypoint.sh）
      #   ② 页面「系统设置 → 平台账号 → 网络代理」→ 拉流/解析（按平台开关）+ 页面「立即更新」
      # 两处都必须填「容器能到达」的地址：容器内的 127.0.0.1 指向容器自身，不能当宿主机代理用。
      # 用法：在宿主机 .env 写一行 LIVEGRAB_PROXY=http://192.168.1.10:20171
      #   - 代理是独立容器且已映射端口 → 填 NAS 的局域网 IP:端口
      #   - 代理与 livegrab 在同一 compose 网络 → 填 http://代理服务名:容器内端口（更稳）
      #   - 纯 SOCKS 端口要写 socks5:// 前缀
      #
      # 为什么用自定义变量名而不直接注入 HTTP_PROXY/HTTPS_PROXY：
      #   ffmpeg 会读 HTTP_PROXY（实测对 http/https 输入都生效），容器级注入会让所有平台
      #   不论开关都走代理，且拉流失败时难以判断是平台问题还是代理问题。入口脚本只在
      #   clone/npm 的命令行上显式带代理，录制链路则完全由页面「平台代理开关」决定。
      LIVEGRAB_PROXY: "${LIVEGRAB_PROXY:-}"
      # 可选：分叉部署时改仓库地址（owner/repo 格式，同时作用于版本检测与容器内 clone；
      # 完整 URL 用 LIVEGRAB_GIT_URL，见 deploy/entrypoint.sh）
      # LIVEGRAB_REPO: "<你的账号>/livegrab"

    volumes:
      # 录制文件：占空间最大，建议挂到大容量磁盘
      - ./data:/data
      # 配置与日志：务必长期保留（账号哈希、Cookie、任务、场次索引、日志）
      - ./config:/config

    # 让容器内可以用 host.docker.internal 指代 NAS 宿主机（Docker 20.10+ 支持 host-gateway）。
    # 代理填 http://host.docker.internal:端口 时依赖这一行；若 NAS 的 Docker 版本过旧
    # 报「invalid host-gateway」，删掉本段、代理改用 NAS 局域网 IP 即可。
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # 停止时给 ffmpeg 留出收尾时间（会把当前分段写完再退出）
    stop_grace_period: 30s

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
